name: Gradle verification

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-check:
    name: Gradle check
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          accept-android-sdk-licenses: true

      # Android 17 SDK Manager publishes the platform directory as android-37.0,
      # while AGP 9.1 resolves compileSdk 37 from the android-37 directory.
      - name: Normalize Android 17 SDK platform path for AGP
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [[ -d "$sdk_root/platforms/android-37.0" && ! -e "$sdk_root/platforms/android-37" ]]; then
            ln -s android-37.0 "$sdk_root/platforms/android-37"
          fi
          test -d "$sdk_root/platforms/android-37"

      - name: Install VLC runtime for JVM audio tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc5 vlc-plugin-base

      - name: Generate JVM audio test fixtures
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave
          from pathlib import Path

          target = Path("composeApp/src/jvmTest/resources/test-audio")
          target.mkdir(parents=True, exist_ok=True)
          sample_rate = 44100
          duration = 2
          for index, frequency in enumerate((220, 330, 440, 550, 660), start=1):
              path = target / f"fixture-{index}.wav"
              with wave.open(str(path), "wb") as audio:
                  audio.setnchannels(1)
                  audio.setsampwidth(2)
                  audio.setframerate(sample_rate)
                  frames = (
                      struct.pack("<h", int(5000 * math.sin(2 * math.pi * frequency * n / sample_rate)))
                      for n in range(sample_rate * duration)
                  )
                  audio.writeframes(b"".join(frames))

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle tasks
        run: ./gradlew :composeApp:check --no-daemon --stacktrace
